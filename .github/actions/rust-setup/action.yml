name: Rust build setup
description: The platform's build dependencies, the pinned toolchain and the compile caches.
inputs:
  cache-key:
    description: >-
      The build cache this job shares: `clippy`, `test` or `release`. Jobs
      that build the same way share one entry across workflows, and jobs
      that build differently keep apart, since one entry holds one kind of
      build. rust-cache adds the OS, Cargo.lock and RUSTFLAGS to the key.
    required: true
  linux-packages:
    description: Extra apt packages for the Linux dependencies step.
    required: false
    default: ""
  save-cache:
    description: >-
      Whether this run saves the rust-cache entry. The default saves only
      from main and dev, never from pull requests, tags or other branches.
      A cache is visible to its own branch, to PRs into it and (for main) to
      everyone, so an entry saved anywhere else helps no later run and only
      pushes main's and dev's entries out of the repository's 10 GB cache
      budget. Over budget GitHub drops the least recently used entries:
      until 2026-11-08 the nightly's release caches were being dropped
      within a day and the next build started cold.
    required: false
    default: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
  sccache:
    description: >-
      Also wrap rustc in sccache. Only clippy turns this on: clippy writes
      small metadata files, and with them sccache rechecks an unchanged
      ff-core in seconds. Test and release builds leave it off: their hit
      rate was 0 to 25 percent (2026-11-08) and every miss saved a large
      library into the same 10 GB budget the rust-cache entries need.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/linux-deps
      if: runner.os == 'Linux'
      with:
        extra-packages: ${{ inputs.linux-packages }}
    - uses: ./.github/actions/windows-deps
      if: runner.os == 'Windows'
    # Windows Defender's real-time scan inspects every object file rustc
    # writes and every one the linker reads back, a known multiple on a
    # Windows runner. The image runs as an administrator, so an exclusion is
    # one cmdlet; if Defender is absent the try/catch keeps this a note.
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        try {
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
          Write-Host "Defender exclusions added for the workspace, cargo and rustup."
        } catch {
          Write-Host "Could not add Defender exclusions ($_); building without them."
        }
    # rust-toolchain.toml names the channel and components; `rustup show`
    # installs them before the first cargo call. .cargo/config.toml asks for
    # twelve jobs to leave a desktop usable; a runner should use every core
    # and no more.
    - shell: bash
      run: |
        rustup show
        # macOS has no nproc; it reports cores through sysctl.
        echo "CARGO_BUILD_JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
    # sccache caches compiled crates by content, so a commit that leaves
    # ff-core alone does not recheck it although its files are new.
    # rust-cache keeps the dependencies' artefacts in the target directory,
    # which also holds the C builds (SDL2, Prism) sccache cannot see. It
    # turns incremental compilation off, which sccache needs.
    - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      if: inputs.sccache == 'true'
    - if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true
        save-if: ${{ inputs.save-cache }}
