name: Windows build dependencies
description: A current CMake and Visual Studio's ATL, which Prism needs on Windows.
runs:
  using: composite
  steps:
    # prism-sys asks CMake for C23. The Windows image's CMake does not map
    # C23 onto MSVC, so use a current CMake that does (/std:clatest).
    - uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest, pinned 2026-10-22
    # prism-sys's SAPI and screen-reader backends include atlbase.h, and
    # the Windows image ships Visual Studio without the ATL component.
    # Restore ATL from the cache when the MSVC version matches; otherwise
    # add it with the Visual Studio installer and cache it for next time.
    - name: Find the MSVC tools
      id: msvc
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
        $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
        "vs=$vs" >> $env:GITHUB_OUTPUT
        "ver=$ver" >> $env:GITHUB_OUTPUT
        "atl=$vs\VC\Tools\MSVC\$ver\atlmfc" >> $env:GITHUB_OUTPUT
    - uses: actions/cache/restore@v4
      id: atl-cache
      with:
        path: ${{ runner.temp }}/atlmfc
        key: vs-atlmfc-${{ runner.os }}-${{ steps.msvc.outputs.ver }}
    - name: Add ATL to Visual Studio
      shell: pwsh
      env:
        VS: ${{ steps.msvc.outputs.vs }}
        ATL: ${{ steps.msvc.outputs.atl }}
        CACHED: ${{ runner.temp }}/atlmfc
      run: |
        if (Test-Path "$env:ATL\include\atlbase.h") { Write-Host "ATL already present"; exit 0 }
        if (Test-Path "$env:CACHED\include\atlbase.h") {
          Copy-Item "$env:CACHED" "$env:ATL" -Recurse -Force
          if (Test-Path "$env:ATL\include\atlbase.h") { Write-Host "ATL restored from cache"; exit 0 }
        }
        $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        $p = Start-Process -FilePath $setup -ArgumentList "modify", "--installPath", "`"$env:VS`"", "--add", "Microsoft.VisualStudio.Component.VC.ATL", "--quiet", "--norestart", "--nocache" -Wait -PassThru
        if ($p.ExitCode -notin 0, 3010) { throw "Visual Studio installer exited $($p.ExitCode)" }
        if (-not (Test-Path "$env:ATL\include\atlbase.h")) { throw "atlbase.h still missing" }
        if (-not (Test-Path "$env:CACHED\include\atlbase.h")) { Copy-Item "$env:ATL" "$env:CACHED" -Recurse -Force }
    - uses: actions/cache/save@v4
      if: steps.atl-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/atlmfc
        key: vs-atlmfc-${{ runner.os }}-${{ steps.msvc.outputs.ver }}
