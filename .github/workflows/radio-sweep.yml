name: Radio stream sweep

# Listens to every stream on the dial from a runner with an open network:
# reachability, what each stream calls itself, and a decoded sample for dead
# air. Reports only; the catalog is edited by hand from what it finds.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      only:
        description: "all, curated or imported"
        default: "all"
      seconds:
        description: "seconds of audio to decode per station"
        default: "25"
      ids:
        description: "comma-separated station ids to hear instead (overrides only)"
        default: ""

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: tools-light
          save-if: false
      - name: Build the audit tool
        run: |
          rustup show
          cargo build -p ff-tools --no-default-features --locked
      - name: Audit
        env:
          IDS: ${{ inputs.ids }}
        run: |
          target/debug/ff-tools audit-radio-streams --only "${{ inputs.only }}" --recheck-dropped \
            --ids "$IDS" \
            --seconds "${{ inputs.seconds }}" \
            --shard ${{ matrix.shard }}/8 --workers 24 \
            --output radio-audit-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: radio-audit-${{ matrix.shard }}
          path: radio-audit-${{ matrix.shard }}.json

  merge:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: radio-audit-*
          merge-multiple: true
      - name: Merge
        run: |
          jq -s '([.[].results[]] | sort_by(.tier, .id)) as $r
            | {counts: (reduce $r[] as $x ({}; .[$x.verdict] += 1)), results: $r}' \
            radio-audit-*.json > radio-audit.json
          jq -c .counts radio-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: radio-audit
          path: radio-audit.json
