# Rust checks: the quick ones, on every push and PR that can affect them.
#
# Windows clippy runs here so PR CI and direct pushes catch `cfg(windows)`
# lints without waiting on the nightly snapshot. Full tests and clippy on
# the other platforms stay on the Career 1.9 snapshot
# (build-career-1.9.yml), slow tests included on Linux x86_64, before it
# packages anything. Local and cloud sessions can still run the full suite.
#
# The changelog gate has its own workflow (changelog.yml) because it must
# report on every change, and this one is path filtered: a required check
# that a path filter skips stays "expected -- waiting for status" forever,
# so nothing here may be made required while the filter stays.
#
#   checks         fmt, the translation files, the test-target layout and the
#                  Hearken leaf-type grep. No game build and a sparse checkout:
#                  well under a minute, on GitHub's hosted runners (free for this
#                  public repository).
#   clippy_windows cargo clippy on windows-2025 via rust-setup (cache-key
#                  clippy). The snapshot workflow skips Windows clippy so
#                  Release stays fast.

name: Rust

permissions:
  contents: read

on:
  push:
    # Alongside main and dev, the Rust release lines take direct pushes instead
    # of PRs, so each needs its own entry for this CI to run.
    branches: [main, dev, feat/career-1.9, feat/rust-port]
    # A release tag runs everything below plus the macOS tests. GitHub does
    # not apply the path filter to a tag push, so a tag always runs.
    tags: ["v*"]
    # What the build or the tests read. Docs, the README, the roadmap and
    # the Python tooling skip this workflow entirely.
    paths:
      - "crates/**"
      - "data/**"
      - "assets/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      # Read by the build or the tests from outside crates/: test fixtures
      # and the JAWS script.
      - "tests/fixtures/**"
      - "tools/jaws/**"
      # The translations: compiled in with include_str!, and kept in step
      # with the spoken text in crates/ by `cargo tools l10n-extract`.
      - "lang/**"
  pull_request:
    branches: [main, dev, feat/career-1.9]
    # Keep in step with the push list.
    paths:
      - "crates/**"
      - "data/**"
      - "assets/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - "tests/fixtures/**"
      - "tools/jaws/**"
      - "lang/**"
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in flight.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The bundled SDL2 source declares a cmake_minimum_required older than
  # CMake 4 accepts; this is CMake's own escape hatch for exactly that.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  checks:
    # Quick checks that need no game build: `cargo fmt` reads the workspace
    # manifests only, and the translation and test-target checks build
    # ff-tools without its `world` feature, so ff-core, SDL2 and Hearken
    # stay out of it. The checkout is sparse and blobless: the 330 MB of
    # world data under data/ is not needed here, only the one file the
    # translation extractor reads.
    name: fmt, translations and test targets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.cargo/
            /.github/actions/update-source/
            /crates/
            /vendor/
            /lang/
            /data/buffs.json

      - name: Install the pinned toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Check shared channel source resolver
        run: node --test .github/actions/update-source/resolve.test.cjs

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: tools-light
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build the tooling (no world feature)
        run: cargo build -p ff-tools --no-default-features --locked

      # Spoken text changed in crates/ must reach lang/ in the same change,
      # or translators work from a stale list.
      - name: Translation files up to date
        run: |
          target/debug/ff-tools l10n-extract --check
          target/debug/ff-tools l10n-check

      - name: Test targets
        run: target/debug/ff-tools test-targets

      # The game keeps its own state stack, menus and speech delivery and
      # takes only Hearken's services and leaf types. Hearken's `Ctx`
      # carries an inherent `say` that would silently shadow the game's
      # `Say` trait, so no game code may reach its app shell.
      - name: Hearken leaf types only
        run: |
          if grep -rnE "hearken::(Ctx|App|ctx|app|screens|run|menu|state|speech_delivery)\b" crates/; then
            echo "::error::Freight Fate uses Hearken's app shell; take the leaf type instead"
            exit 1
          fi

  clippy_windows:
    # Windows-only clippy for PR CI and the watched push branches. The
    # snapshot workflow skips Windows clippy so Release is not held up; this
    # job owns that platform instead. Reuses rust-setup (windows-deps,
    # Defender exclusions, sccache, rust-cache with cache-key clippy).
    name: clippy (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      HEARKEN_TEST_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust and the build caches
        uses: ./.github/actions/rust-setup
        with:
          cache-key: clippy

      - name: Lint Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings
