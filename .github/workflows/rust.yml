# Rust CI: the game and ff-core, on every push and PR that can affect them.
#
# The Python suite has its own workflow (ci.yml), and the changelog gate its
# own (changelog.yml), because both must report on every change, and this one
# is path filtered. Keep it apart for the same reason: a required check that
# a path filter skips stays "expected -- waiting for status" forever, so
# nothing here may be made required while the filter stays.
#
# The game is built on the Hearken engine (crates from the public
# orinks-games/hearken repository, a git dependency pinned by Cargo.lock),
# which Cargo fetches anonymously.
#
# Runners (2026-10-17): GitHub's hosted runners. Freight Fate is public, so
# they cost nothing; the paid Blacksmith minutes are kept for the private
# repositories. Every job starts at once, and the slowest, the Windows
# tests, sets the wall time.
#
#   checks   fmt, the translation files, the test-target layout. No build
#            and a sparse checkout: well under a minute.
#   clippy   once, on Linux, with warnings denied. The Windows-only code is
#            linted by the nightly's Windows test leg, every night.
#   test     the game on Windows and Linux in parallel; ff-core on Linux
#            only. ff-core is headless, so the Linux runner proves it as
#            well as Windows does, and its test binaries stay off the slow
#            Windows compile.
#   test-macos  the game and ff-core on macOS, for a manual run and a `v*`
#            tag only, not per push or PR (Hearken's CI does the same). It
#            proves the Mac link (Prism's frameworks, the clang runtime) and
#            the Kira/CoreAudio build before a release; the nightly's Mac
#            job tests it every night as well.
#
# Caches: rust-cache entries are shared by kind of build (`clippy`, `test`),
# and the nightly's test legs use the same `test` entries. rust-cache folds
# the OS (the rustc host), Cargo.lock and RUSTFLAGS into the key, so Windows
# and Linux never collide, and a manual full run never overwrites the quick
# set's entry. Clippy does not share the tests' entry on purpose: it builds
# check-only metadata and no test binaries, so one shared key would hold
# whichever job saved first and leave the other cold. sccache, keyed by
# content, is shared by all of them. Everything lives in the repository's
# 10 GB of GitHub cache, and only pushes save (see rust-setup).
#
# The runner is plain `cargo test`, not nextest. nextest runs every test in
# a process of its own, and each game test process loads the world data
# once (ff_core::data::world's OnceCell), so ~3,300 game-crate tests would
# each pay that load; `frame_time` also needs the machine to itself.
#
# Pushes and PRs pass `--cfg ci_quick`, which turns every
# `#[cfg_attr(ci_quick, ignore = "sweep: ...")]` test into an ignored one.
# Those are the whole-map sweeps -- a 500-mile delivery per state line, every
# facility exit, every kind of destination, ~96 job origins -- and they cost
# as much as the other 2,400 game-crate tests together. They run in full on
# the nightly (build-career-1.9.yml's Linux x86_64 test leg), on a manual
# `workflow_dispatch` of this workflow, and in any local `cargo test`.
#
# Each crate builds its integration tests as one binary, `it`, plus a few
# that need a process of their own (`cargo tools test-targets` lists them
# and the checks job enforces it), because every test binary is another link
# of the whole dependency graph.

name: Rust

permissions:
  contents: read

on:
  push:
    # Alongside main and dev, the Rust release lines take direct pushes instead
    # of PRs, so each needs its own entry for this CI to run.
    branches: [main, dev, feat/career-1.9, feat/rust-port]
    # A release tag runs everything below plus the macOS tests. GitHub does
    # not apply the path filter to a tag push, so a tag always runs.
    tags: ["v*"]
    # What the build or the tests read. Docs, the README, the roadmap and
    # the Python tooling skip this workflow entirely.
    paths:
      - "crates/**"
      - "data/**"
      - "assets/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      # Read by the build or the tests from outside crates/: test fixtures
      # and the JAWS script.
      - "tests/fixtures/**"
      - "tools/jaws/**"
      # The translations: compiled in with include_str!, and kept in step
      # with the spoken text in crates/ by `cargo tools l10n-extract`.
      - "lang/**"
  pull_request:
    branches: [main, dev, feat/career-1.9]
    # Keep in step with the push list.
    paths:
      - "crates/**"
      - "data/**"
      - "assets/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - "tests/fixtures/**"
      - "tools/jaws/**"
      - "lang/**"
  # A manual run is the FULL suite: no `--cfg ci_quick`, sweeps included.
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in flight.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The bundled SDL2 source declares a cmake_minimum_required older than
  # CMake 4 accepts; this is CMake's own escape hatch for exactly that.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  checks:
    # Quick checks that need no game build: `cargo fmt` reads the workspace
    # manifests only, and the translation and test-target checks build
    # ff-tools without its `world` feature, so ff-core, SDL2 and Hearken
    # stay out of it. The checkout is sparse and blobless: the 330 MB of
    # world data under data/ is not needed here, only the one file the
    # translation extractor reads.
    name: fmt, translations and test targets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.cargo/
            /crates/
            /lang/
            /data/buffs.json

      - name: Install the pinned toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: tools-light
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build the tooling (no world feature)
        run: cargo build -p ff-tools --no-default-features --locked

      # Spoken text changed in crates/ must reach lang/ in the same change,
      # or translators work from a stale list.
      - name: Translation files up to date
        run: |
          target/debug/ff-tools l10n-extract --check
          target/debug/ff-tools l10n-check

      - name: Test targets
        run: target/debug/ff-tools test-targets

      # The game keeps its own state stack, menus and speech delivery and
      # takes only Hearken's services and leaf types. Hearken's `Ctx`
      # carries an inherent `say` that would silently shadow the game's
      # `Say` trait, so no game code may reach its app shell.
      - name: Hearken leaf types only
        run: |
          if grep -rnE "hearken::(Ctx|App|ctx|app|screens|run|menu|state|speech_delivery)\b" crates/; then
            echo "::error::Freight Fate uses Hearken's app shell; take the leaf type instead"
            exit 1
          fi

  clippy:
    # Workspace-wide and every target, so test and bench code is linted
    # too; warnings are errors. `--locked`: Cargo.lock is committed (it also
    # pins the Hearken commit), so a dependency change that was not locked
    # in fails here loudly instead of resolving to something no developer
    # has run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: clippy

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo clippy (without the visual display)
        # Every build names the visual display, so nothing else compiles the
        # game without it; this keeps that build working for a target that
        # leaves the display out.
        run: cargo clippy -p freight-fate --all-targets --no-default-features --features agent-server --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            packages: -p freight-fate
          - name: Linux
            os: ubuntu-24.04
            packages: -p ff-core -p freight-fate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # No speech synthesiser, window or audio device on a runner.
      FREIGHT_FATE_NO_SPEECH: "1"
      HEARKEN_TEST_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      # Pushes and PRs run the quick set (see the header); a manual dispatch
      # runs everything. (`cond && a || b` is the Actions conditional; it is
      # safe here because the flag is never empty.)
      RUSTFLAGS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '--cfg ci_quick' || '' }}
    steps:
      # A plain checkout: sounds.pak is an ordinary blob, not an LFS object,
      # so the audio tests have the real pack.
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test

      - name: Build the test binaries
        # The build on its own, so a compile failure reads as one and the
        # timing report covers exactly the compile.
        run: cargo test ${{ matrix.packages }} --no-run --locked --timings

      - name: The game starts on a clean Windows
        # The snapshot's payload DLL check, on the executable the step above
        # already built: an import neither Windows nor the payload provides
        # (mfplat.dll, from a decoder linked at load time) fails this PR
        # instead of the next snapshot. A few seconds; no release build.
        if: matrix.name == 'Windows'
        run: cargo run -q -p ff-tools --no-default-features --locked -- windows-imports target/debug

      - name: cargo test
        run: cargo test ${{ matrix.packages }} --locked

      - name: cargo test (agent server)
        # Agent tooling, not the game: `test = false` keeps it out of the run
        # above and out of a plain local `cargo test`, so it runs by name.
        run: cargo test -p freight-fate --test agent_server --locked

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Upload the build timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timing-${{ matrix.name }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

  test-macos:
    # A manual run or a release tag only: Mac runners are the slowest and
    # the fewest at once, and nothing per push touches Mac-only code that
    # the nightly's Mac job would not catch by morning. GitHub's hosted
    # macos-26, as the nightly and the iOS jobs use.
    name: test (macOS)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      HEARKEN_TEST_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # A tag runs the quick set, as a push does; a manual run, everything.
      RUSTFLAGS: ${{ github.event_name == 'push' && '--cfg ci_quick' || '' }}
    steps:
      - uses: actions/checkout@v6

      # No brewed SDL: Homebrew's sdl2 is sdl2-compat, which loads SDL3 at
      # run time. SDL2 is compiled in from source with the runner's cmake.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test

      - name: Build the test binaries
        run: cargo test -p ff-core -p freight-fate --no-run --locked --timings

      - name: cargo test
        run: cargo test -p ff-core -p freight-fate --locked

      - name: cargo test (agent server)
        run: cargo test -p freight-fate --test agent_server --locked

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Upload the build timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timing-macOS
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
