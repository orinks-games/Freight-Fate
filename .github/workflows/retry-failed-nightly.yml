name: Retry failed nightly

# One workflow to watch since the 1.9 cutover (2026-09-20): build.yml was
# deleted with the 1.8 line, so build-career-1.9.yml is the snapshot build.
# Its name is "Freight Fate builds"; workflow_run matches by that name, so a
# rename there must be copied here (under the old name this never fired).
#
# The snapshot starts on each push to dev (dev's copy of the workflow) and
# once a night from main's copy as a fallback. Either kind of run that
# fails is retried here, once, from dev's copy. workflow_run workflows run
# from the default branch, so a change to this file reaches GitHub only
# once it is on main.

on:
  workflow_run:
    workflows: [Freight Fate builds]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-nightly-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  SNAPSHOT_WORKFLOW: "Freight Fate builds"
  # The ref the retry runs on, and so whose copy of the workflow it runs.
  # dev's copy is the one that built the failed push, and it builds dev by
  # default (the beta channel); main's copy may lag it.
  SNAPSHOT_BRANCH: "dev"

jobs:
  retry:
    name: Retry once after delay
    # A job that hits its timeout ends the run as `cancelled`, not `failure`
    # (2026-10-02: a hung Fedora ARM boot cost that night's snapshot). A
    # push build cancelled by a newer push is also `cancelled`; the step
    # below tells the two apart by whether dev has moved on.
    if: >-
      (github.event.workflow_run.event == 'schedule' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev')) &&
      contains(fromJSON('["failure", "cancelled", "timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Wait for a transient failure to clear
        run: sleep 2700

      - name: Dispatch one recovery build if still needed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="1.9-tester-$(date -u +%Y%m%d)"

          if [ "$RUN_EVENT" = "push" ]; then
            DEV_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq .commit.sha)
            if [ "$DEV_SHA" != "$RUN_SHA" ]; then
              echo "dev has moved on to $DEV_SHA since $RUN_SHA; that push's own build takes over."
              exit 0
            fi
          fi

          # Today's snapshot may already be up: the run recovered while this
          # waited, or an earlier push cut one. For a push that counts only
          # when the snapshot is of the pushed commit; for the nightly
          # fallback any snapshot of the day will do, as before.
          if TARGET=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish 2>/dev/null); then
            if [ "$RUN_EVENT" != "push" ] || [ "$TARGET" = "$RUN_SHA" ]; then
              echo "$TAG already exists; the snapshot recovered while waiting."
              exit 0
            fi
          fi

          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "$SNAPSHOT_WORKFLOW" --limit 20 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "A snapshot is already queued or running; not dispatching a duplicate."
            exit 0
          fi

          echo "The snapshot is still missing after 45 minutes; dispatching one retry."
          gh workflow run "$SNAPSHOT_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            --ref "$SNAPSHOT_BRANCH" -f dry_run=false
