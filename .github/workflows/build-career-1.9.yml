name: Career 1.9 snapshot

# The nightly (and the stable release path) for the 1.9 line, which since
# the 2026-09-20 cutover is `dev` (see CAREER_BRANCH below).
#
# A scheduled run executes the copy of this file on the DEFAULT branch
# (main), whatever the checked-out code is, so after changing it here push
# the same file to main or the nightly quietly keeps the old job list. The
# Prepare job fails a scheduled run whose file differs from CAREER_BRANCH's.
#
# Stable releases: push a `v*.*.*` tag. That trigger drops `--prerelease`,
# takes the version from the tag, and writes notes via
# `tools/release_notes.py stable`. Do not tag from this workflow.
#
# Runners (2026-10-17): GitHub's hosted runners, as in rust.yml. This
# repository is public, so they cost nothing; Linux packages on 22.04 (x86_64
# and ARM64) for the glibc floor.
#
# Shape: the tests and the packaging run side by side. Each platform's
# `Test` leg lints and runs the suite while its `Build` job compiles the
# release profile and packages; they share nothing a job could hand the
# other (a test build and a release build are different compiles), so
# running them one after the other only added the two. Release waits on
# both. The whole-map sweeps run once, on the Linux x86_64 leg, the fastest
# runner; the other legs run the quick set.
#
# The game is built on the Hearken engine, a public git dependency; every
# job that compiles goes through .github/actions/rust-setup.

on:
  schedule:
    - cron: "37 2 * * *"
    # Backup start. GitHub sometimes drops a scheduled start outright
    # (2026-10-12: no scheduled workflow in the repo fired). This one builds
    # only when the day's snapshot does not exist yet; see Prepare.
    - cron: "37 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip release creation"
        type: boolean
        default: false
      branch:
        description: "Branch to build (a dry run is the way to try one)"
        type: string
        default: dev
      release_candidate:
        description: "Also publish as the 1.9 release candidate under nightly-YYYYMMDD, where 1.8 developer-snapshot players' updater finds it"
        type: boolean
        default: false
  # Stable releases: push a v*.*.* tag on the commit to ship. Do not invent
  # the tag from a schedule or dispatch -- only an explicit tag push cuts a
  # stable GitHub release (no --prerelease, notes from the version block).
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: career-19-snapshot
  # A scheduled start queues behind a running build instead of cancelling
  # it, so the backup start can never kill a late primary run.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  PYTHON_VERSION: "3.12"
  # `dev` since the 1.9 cutover (2026-09-20). This built feat/career-1.9
  # while 1.9 was a side line; dev IS the 1.9 line now, and this is the
  # only workflow that knows how to build the Rust game, so it is the
  # nightly -- and now the only one that builds the game at all. build.yml
  # ran the Python/Nuitka path and was deleted with the 1.8 line: dev has
  # no Python gameplay left to feed it, and the owner ruled on 2026-09-20
  # that 1.8 gets no further releases, so it had no job on either trigger.
  #
  # The `1.9-tester-*` tag scheme deliberately does NOT change. The
  # in-game updater's developer-snapshot channel finds builds by that
  # name, so renaming it would strand everyone already on one.
  # A manual run may name another branch to try; the schedule always
  # builds dev.
  # Tag pushes build the tagged commit. Schedule/dispatch still build
  # `dev` (or the dispatch branch). A tag that only exists on another
  # tip must not silently rebuild today's dev.
  CAREER_BRANCH: ${{ github.event_name == 'push' && github.ref || inputs.branch || 'dev' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CAREER_BRANCH }}
          fetch-depth: 0

      - name: Refuse to run a stale copy of this workflow
        # GITHUB_WORKFLOW_SHA is the commit the running workflow file came
        # from: main on a schedule, the dispatched ref otherwise. HEAD is the
        # career branch. A scheduled run on a stale main file must fail here
        # rather than ship a snapshot missing whole platforms. So must a
        # dispatch that would publish: on 2026-10-19 one from main built every
        # platform for 25 minutes, then its Release job refused the assets
        # main's stale copy still expected (the update archives dev dropped).
        # A dry run only warns, so the file can be iterated on a branch first.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git fetch --quiet origin "$GITHUB_WORKFLOW_SHA"
          if git diff --quiet "$GITHUB_WORKFLOW_SHA" HEAD -- .github/workflows/build-career-1.9.yml; then
            exit 0
          fi
          msg="$GITHUB_REF_NAME's .github/workflows/build-career-1.9.yml differs from $CAREER_BRANCH's; push the branch's copy to main."
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; }; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg"

      - name: Check snapshot conditions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Stable path: an explicit v*.*.* tag push. Version and tag come
          # from the tag itself; notes come from the matching CHANGELOG
          # block (falling back to Unreleased if that heading is not cut
          # yet). Never invent a stable tag from schedule or dispatch.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=1.9-tester-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The backup start builds only when the primary start never made
          # today's snapshot (dropped, or failed past its retry).
          if [ "$SCHEDULE" = "37 8 * * *" ] \
            && gh release view "1.9-tester-$(date -u +%Y%m%d)" >/dev/null 2>&1; then
            echo "Today's snapshot already exists; the backup start has nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list "1.9-tester-*" --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
          : > latest-stable-notes.md
          LATEST_STABLE_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')
          if [ -n "$LATEST_STABLE_TAG" ]; then
            gh release view "$LATEST_STABLE_TAG" --json body -q .body > latest-stable-notes.md || true
          fi
          python3 tools/release_notes.py should-build-nightly \
            --previous-tag "$LAST_TAG" \
            --exclude-notes previous-notes.md \
            --latest-stable-tag "$LATEST_STABLE_TAG" \
            --exclude-stable-notes latest-stable-notes.md \
            >> "$GITHUB_OUTPUT"

      - name: Fold the accepted community stations
        # Every build ships the stations accepted on orinks.net up to the
        # moment it was cut. Folded once here so all three platforms ship the
        # same list. This used to be a daily job committing to dev, which
        # dev's required checks refuse from the workflow token. When the site
        # cannot be read the tool leaves the committed copy alone and the
        # build ships that, since players also download the list at launch.
        if: steps.check.outputs.should_build == 'true'
        run: |
          python3 tools/fold_community_stations.py \
            || echo "::warning::Could not read the accepted stations; shipping the committed copy."

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.should_build == 'true'
        with:
          name: community-stations
          path: data/radio_community.json
          retention-days: 7

  format:
    # Formatting is the same on every platform, so it is checked once, on
    # the cheap Linux runner, instead of on each packaging runner. Release
    # still needs it.
    name: Format
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Check Rust formatting
        run: cargo fmt --all --check

  test:
    # Lint and test each platform, side by side with its packaging job.
    # clippy runs here on every platform, the schedule included: rust.yml
    # lints on Linux only, so this is where the `cfg(windows)` and
    # `cfg(target_os)` code gets linted.
    name: Test (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            rustflags: --cfg ci_quick
          - name: macOS
            os: macos-26
            rustflags: --cfg ci_quick
          # The FULL suite: no `--cfg ci_quick`, so the whole-map sweeps the
          # per-push workflow (rust.yml) leaves out run here, and only here.
          # They are headless driving logic, so one platform proves them.
          - name: Linux x86_64
            os: ubuntu-24.04
            rustflags: ""
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            rustflags: --cfg ci_quick
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      HEARKEN_TEST_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # clippy and the tests on the same RUSTFLAGS, so both share one debug
      # build of the native dependencies (SDL2, Prism).
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Rust and the build caches
        # The same `test` cache rust.yml's test jobs keep, so a night after
        # a day of pushes starts warm.
        uses: ./.github/actions/rust-setup
        with:
          cache-key: test

      - name: Lint Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test -p ff-core -p freight-fate --locked

      - name: Test the agent server
        run: cargo test -p freight-fate --test agent_server --locked

  build_windows:
    name: Build (Windows)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust and the build caches
        # CMake and ATL for Prism, the pinned toolchain, sccache and
        # rust-cache: the same setup rust.yml's jobs use.
        uses: ./.github/actions/rust-setup
        with:
          cache-key: release

      - name: Ship the accepted community stations
        uses: actions/download-artifact@v7
        with:
          name: community-stations
          path: data

      - name: Build the portable release
        run: ./build-release.ps1 --tag "${{ needs.prepare.outputs.tag }}"

      - name: Check Prism registered its backends
        # Every job here runs muted, so a Prism linked without its backends
        # would still pass every test and boot. The listing does not speak;
        # it names each backend Prism registered, reachable or not.
        shell: bash
        run: |
          ./target/release/freightfate.exe --list-speech-backends | tee speech-backends.txt
          grep -q "^SAPI " speech-backends.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: dist/FreightFate-*-windows-portable.zip
          if-no-files-found: error

  build_macos:
    name: Build (macOS Apple Silicon)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-26
    # Notarization waits up to 45 minutes (tools/build_release.py) and starts
    # about 16 minutes in, so the job outlasts it and a slow Apple queue ends
    # in Apple's own verdict and log, not a GitHub timeout (v1.9.3 hit 60).
    timeout-minutes: 75
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # The bundled SDL2 source declares a cmake_minimum_required older
      # than CMake 4 accepts; this is CMake's own escape hatch for exactly
      # that, and building SDL2 in is what keeps sdl2-compat/SDL3 out.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust and the build caches
        uses: ./.github/actions/rust-setup
        with:
          cache-key: release

      # No brewed SDL: Homebrew's sdl2 is sdl2-compat, which loads SDL3 at
      # runtime and dies on player Macs without Homebrew. SDL2 is compiled
      # from source into the executable (`bundled` + `static-link`) using
      # the runner's preinstalled cmake; the staging step fails the build
      # if the executable links any SDL dynamically.

      - name: Import the Developer ID signing credentials
        # Signs as "Developer ID Application: Joshua Tubbs" and notarizes
        # with the App Store Connect key, so Gatekeeper opens the app without
        # the Open Anyway step. The certificate goes into a throwaway keychain
        # and the key into RUNNER_TEMP, never the checkout or the bundle.
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            if [ "$IS_PRERELEASE" = "false" ]; then
              echo "A stable release must be Developer ID signed and notarized; the signing secrets are missing." >&2
              exit 1
            fi
            echo "::warning::Signing secrets are not configured; this Mac build is ad-hoc signed and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/freight-fate-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer_id.p12"
          # The G2 intermediate is not in macOS's system keychain; without it
          # the identity is untrusted and codesign finds nothing to sign with.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="Developer ID Application: Joshua Tubbs ($APPLE_TEAM_ID)"
          security find-identity -v -p codesigning "$keychain" | grep -F "$identity"
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "MACOS_SIGN_KEYCHAIN=$keychain"
            echo "MACOS_NOTARY_KEY_PATH=$key_path"
            echo "MACOS_NOTARY_KEY_ID=$ASC_KEY_ID"
            echo "MACOS_NOTARY_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Ship the accepted community stations
        uses: actions/download-artifact@v7
        with:
          name: community-stations
          path: data

      - name: Build the macOS release
        # --smoke boots the PACKAGED app for five frames with dummy drivers:
        # real dylib loading, real data, real boot. The old non-launch mode
        # existed because hosted runners hung before first log -- the boot
        # probes (speech, audio device) that 2026-08-30 moved onto worker
        # threads; with them gone the launch proof is back. Bounded at 120 s
        # inside the builder, which dumps the game log on failure.
        run: uv run python tools/build_release.py --rust --smoke --tag "${{ needs.prepare.outputs.tag }}"

      - name: Check Prism registered its backends
        # Every job here runs muted, so a Prism linked without its backends
        # would still pass every test and boot. The listing does not speak;
        # it names each backend Prism registered, reachable or not.
        shell: bash
        run: |
          ./target/release/freightfate --list-speech-backends | tee speech-backends.txt
          grep -q "^AVSpeech " speech-backends.txt

      - name: Remove the signing credentials
        if: always()
        shell: bash
        run: |
          if [ -n "${MACOS_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGN_KEYCHAIN" || true
          fi
          rm -f "${MACOS_NOTARY_KEY_PATH:-/nonexistent}"

      - uses: actions/upload-artifact@v7
        with:
          name: macOS-arm64
          path: dist/FreightFate-*-macos-arm64.zip
          if-no-files-found: error

  build_linux:
    name: Build (Linux ${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    # 22.04, not latest: the executable carries its build host's glibc as a
    # floor (2.35 here), and one built on 24.04 would refuse to start on any
    # distribution still shipping an older release, with no useful error.
    # SDL2 and Prism (with gcc 13's libstdc++) are compiled in; Prism opens
    # the player's Speech Dispatcher at run time rather than linking it.
    #
    # Two native builds, one per CPU: x86_64 for PCs and aarch64 for the
    # Blazie BT Speak and BT Braille (Debian on a Raspberry Pi Compute
    # Module 4 and 5), Raspberry Pi desktops and other ARM64 Linux. Both
    # are GitHub's 22.04 images, x86_64 and ARM64, so both carry the
    # same glibc floor. The steps are identical: build_release.py and
    # build_appimage.py each pick their architecture from `uname -m`.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            tarball: linux-x64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            tarball: linux-arm64
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      # Same escape hatch as the Mac job: the bundled SDL2 declares a
      # cmake_minimum_required older than CMake 4 accepts. 22.04 ships
      # CMake 3.22, where this is a no-op, but the image updates.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust and the build caches
        # .github/actions/linux-deps installs what SDL2 and Prism compile
        # against: the whole desktop set of SDL2 backends (a backend whose
        # headers are missing is compiled out for every player), gcc 13 from
        # Ubuntu's toolchain PPA (22.04 stops at 12; Prism needs 13's
        # libstdc++, linked statically) and Speech Dispatcher's headers. It
        # sets CC/CXX before rust-cache keys on them: a CMake build directory
        # configured by another compiler throws its cache away, and SDL2
        # then tries to install into /usr/local. desktop-file-utils validates
        # the AppImage's launcher entry.
        uses: ./.github/actions/rust-setup
        with:
          cache-key: release
          linux-packages: file desktop-file-utils

      - name: Ship the accepted community stations
        uses: actions/download-artifact@v7
        with:
          name: community-stations
          path: data

      - name: Build the Linux release
        # --smoke boots the staged tarball payload for five frames with dummy
        # drivers, the same proof the Mac job gets. Staging refuses an
        # executable that links SDL2 dynamically.
        run: uv run python tools/build_release.py --rust --smoke --tag "${{ needs.prepare.outputs.tag }}"

      - name: Check Prism registered its backends
        # Every job here runs muted, so a Prism linked without its backends
        # would still pass every test and boot. The listing does not speak;
        # it names each backend Prism registered, reachable or not.
        shell: bash
        run: |
          ./target/release/freightfate --list-speech-backends | tee speech-backends.txt
          grep -q "^Speech Dispatcher " speech-backends.txt

      - name: Package the AppImage
        timeout-minutes: 15
        run: uv run python tools/build_appimage.py --rust --tag "${{ needs.prepare.outputs.tag }}"

      - uses: actions/upload-artifact@v7
        with:
          name: Linux-${{ matrix.arch }}
          path: |
            dist/FreightFate-*-${{ matrix.tarball }}.tar.gz
            dist/FreightFate-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  smoke_linux:
    name: Smoke (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [prepare, build_linux]
    # The build host proves one distribution. Players run the others, and
    # what differs between them -- glibc, the dynamic loader, which
    # libraries a desktop install carries -- is exactly what a build on
    # Ubuntu cannot see. So the tarball and the AppImage are both booted,
    # untouched, on each of the popular families, in a bare container that
    # has less than any desktop does.
    #
    # The same matrix runs again on an ARM64 runner against the aarch64
    # downloads, minus Arch: Docker Hub's archlinux image is amd64 only
    # (Arch Linux ARM is a separate project with no official image). The
    # Debian containers there are the nearest stand-in for the BT Speak and
    # BT Braille, which are Debian on a Raspberry Pi Compute Module.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed:latest
        exclude:
          - arch: aarch64
            image: archlinux:latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          sparse-checkout: tools/linux_smoke.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: Linux-${{ matrix.arch }}
          path: dist

      - name: Boot the tarball and the AppImage
        run: docker run --rm -v "$PWD:/work" "${{ matrix.image }}" bash /work/tools/linux_smoke.sh

  release:
    name: Release
    needs: [prepare, format, test, build_windows, build_macos, build_linux, smoke_linux]
    if: always() && needs.prepare.outputs.should_build == 'true' && needs.format.result == 'success' && needs.test.result == 'success' && needs.build_windows.result == 'success' && needs.build_macos.result == 'success' && needs.build_linux.result == 'success' && needs.smoke_linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: Windows
          path: release-assets

      - uses: actions/download-artifact@v7
        with:
          name: macOS-arm64
          path: release-assets

      - uses: actions/download-artifact@v7
        with:
          name: Linux-x86_64
          path: release-assets

      - uses: actions/download-artifact@v7
        with:
          name: Linux-aarch64
          path: release-assets

      - name: Verify release archives
        shell: bash
        run: |
          shopt -s nullglob
          windows_archives=(release-assets/FreightFate-*-windows-portable.zip)
          if [ "${#windows_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows portable archive; found ${#windows_archives[@]}." >&2
            exit 1
          fi
          macos_archives=(release-assets/FreightFate-*-macos-arm64.zip)
          if [ "${#macos_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Apple Silicon macOS archive; found ${#macos_archives[@]}." >&2
            exit 1
          fi
          linux_archives=(release-assets/FreightFate-*-linux-x64.tar.gz)
          if [ "${#linux_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux tarball; found ${#linux_archives[@]}." >&2
            exit 1
          fi
          linux_appimages=(release-assets/FreightFate-*-linux-x86_64.AppImage)
          if [ "${#linux_appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux AppImage; found ${#linux_appimages[@]}." >&2
            exit 1
          fi
          linux_arm64_archives=(release-assets/FreightFate-*-linux-arm64.tar.gz)
          if [ "${#linux_arm64_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux ARM64 tarball; found ${#linux_arm64_archives[@]}." >&2
            exit 1
          fi
          linux_arm64_appimages=(release-assets/FreightFate-*-linux-aarch64.AppImage)
          if [ "${#linux_arm64_appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux ARM64 AppImage; found ${#linux_arm64_appimages[@]}." >&2
            exit 1
          fi

      - name: Prepare and verify release notes and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          # The translator's kit is one download beside the game archives,
          # not a folder inside each of them.
          python3 tools/translation_kit.py --label "$TAG" --out release-assets
          (cd release-assets && sha256sum FreightFate-*-windows-portable.zip FreightFate-*-macos-arm64.zip FreightFate-*-linux-x64.tar.gz FreightFate-*-linux-x86_64.AppImage FreightFate-*-linux-arm64.tar.gz FreightFate-*-linux-aarch64.AppImage FreightFate-*-translation-kit.zip > checksums.txt)
          (cd release-assets && sha256sum -c checksums.txt)

          if [ "$IS_PRERELEASE" = "true" ]; then
            LAST_TAG=$(git tag --list "1.9-tester-*" --sort=-version:refname | grep -v "^$TAG$" | head -1)
            if [ -n "$LAST_TAG" ]; then
              gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
              python3 tools/release_notes.py nightly \
                --previous-tag "$LAST_TAG" \
                --exclude-notes previous-notes.md \
                --output notes.md
            else
              python3 tools/release_notes.py nightly --first-snapshot --output notes.md
            fi
          else
            # Stable notes: the matching ## version block, or Unreleased if
            # that heading has not been cut yet (release_notes.stable_notes).
            python3 tools/release_notes.py stable --version "$VERSION" --output notes.md
          fi
          test -s notes.md
          python3 tools/release_notes.py check-size --input notes.md --max-characters 120000
          test -s release-assets/checksums.txt

      - name: Create prerelease
        if: ${{ inputs.dry_run != true && needs.prepare.outputs.is_prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" release-assets/* --notes-file notes.md \
            --title "Freight Fate 1.9 tester snapshot $(date -u +%Y-%m-%d)" \
            --prerelease --target "$COMMIT_SHA"

      # Keep the release page to the last week of tester snapshots; testers
      # can still roll back that far. Tags stay (the notes step reads the
      # previous one). A failed prune never fails the release.
      - name: Prune old tester snapshots
        if: ${{ inputs.dry_run != true && needs.prepare.outputs.is_prerelease == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/prune_snapshots.py --keep 7

      # The 1.8 updater's developer-snapshot channel looks only at the 20
      # newest releases for a `nightly-YYYYMMDD` prerelease, and on a Mac
      # for an asset ending `-macos.zip`; it has never heard of
      # `1.9-tester-*`. This republishes the same archives under that name
      # so a 1.8 nightly player is offered 1.9. Every 1.8 Mac build was
      # Apple Silicon only, so the arm64 app is the right one for them. The
      # archives keep their own build_info.json, so once installed the game
      # follows `1.9-tester-*` like any tester build.
      - name: Publish the release candidate for 1.8 developer snapshots
        if: ${{ inputs.dry_run != true && inputs.release_candidate && needs.prepare.outputs.is_prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          BRIDGE="nightly-${TAG#1.9-tester-}"
          mkdir bridge-assets
          cp release-assets/FreightFate-* bridge-assets/
          for zip in bridge-assets/FreightFate-*-macos-arm64.zip; do
            cp "$zip" "${zip%-macos-arm64.zip}-macos.zip"
          done
          (cd bridge-assets && sha256sum FreightFate-* > checksums.txt)

          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'].split('.dev')[0])")
          python3 tools/release_notes.py stable --version "$VERSION" --output stable-notes.md
          {
            echo "Freight Fate 1.9 release candidate. Careers from 1.8 do not carry over to 1.9, so you start a new career; your 1.8 career files are left as they are."
            echo
            cat stable-notes.md
          } > bridge-notes.md
          python3 tools/release_notes.py check-size --input bridge-notes.md --max-characters 125000

          if gh release view "$BRIDGE" >/dev/null 2>&1; then
            gh release delete "$BRIDGE" -y --cleanup-tag
          elif git ls-remote --exit-code --tags origin "refs/tags/$BRIDGE" >/dev/null 2>&1; then
            git push origin ":refs/tags/$BRIDGE"
          fi
          # GitHub shows an asset's label in place of its file name. The
          # updaters match on the name, so the plain Mac copy keeps it and
          # gets a label saying it is the same app as the arm64 zip.
          assets=()
          for f in bridge-assets/*; do
            case "$f" in
              *-macos.zip) assets+=("$f#$(basename "$f") (in-game updater copy, same app as the macos-arm64 zip)") ;;
              *) assets+=("$f") ;;
            esac
          done
          gh release create "$BRIDGE" "${assets[@]}" --notes-file bridge-notes.md \
            --title "Freight Fate 1.9 release candidate $(date -u +%Y-%m-%d)" \
            --prerelease --target "$COMMIT_SHA"

      - name: Create stable release
        if: ${{ inputs.dry_run != true && needs.prepare.outputs.is_prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          # Stable tags are owner-pushed. Never delete or move one from CI.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace a stable release." >&2
            exit 1
          fi
          # Every stable updater on a Mac, 1.8's and 1.9's alike, looks for
          # an asset ending `-macos.zip`; without this copy no Mac install is
          # ever offered the release. The arm64 name stays for the snapshots.
          for zip in release-assets/FreightFate-*-macos-arm64.zip; do
            cp "$zip" "${zip%-macos-arm64.zip}-macos.zip"
          done
          (cd release-assets && sha256sum FreightFate-* > checksums.txt)
          # GitHub shows an asset's label in place of its file name. The
          # updaters match on the name, so the plain Mac copy keeps it and
          # gets a label saying it is the same app as the arm64 zip.
          assets=()
          for f in release-assets/*; do
            case "$f" in
              *-macos.zip) assets+=("$f#$(basename "$f") (in-game updater copy, same app as the macos-arm64 zip)") ;;
              *) assets+=("$f") ;;
            esac
          done
          gh release create "$TAG" "${assets[@]}" --notes-file notes.md \
            --title "Freight Fate $VERSION" \
            --target "$COMMIT_SHA"
