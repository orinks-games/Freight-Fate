[project]
name = "freight-fate"
version = "1.9.0.dev0"
description = "An accessible, audio-first cross-country trucking simulation game"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Orinks" }]
keywords = ["game", "accessibility", "audio-game", "screen-reader", "trucking", "simulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Simulation",
]
# The game is Rust (crates/); this project is the Python build, bake and data
# tooling under tools/. numpy is the one runtime import those tools share
# (tools/assets_pack.py masks the sound packs with it).
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/orinks-games/Freight-Fate"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "soundfile>=0.14.0",
    "pre-commit>=4.6.0",
    "openrouteservice>=2.3.3",
    "osmium>=4.3.1",
    "scipy>=1.13",
]
# Extra tooling for route enrichment
# (tools/enrich_routes.py --ors-smoke, ORS-backed corridor generation), and
# audio work -- av for tools/encode_music_opus.py, scipy for
# tools/patch_loop_transients.py and the sound-test/audition scripts. SciPy
# is also in dev because the billboard-ban tests import its build tool. Run
# with `uv run --group tooling ...`.
tooling = [
    "osmium>=4.0.2",
    "openrouteservice>=2.2.0",
    "av>=14.0",
    "scipy>=1.13",
]

[tool.uv]
# Not an installable package: nothing here is imported from site-packages.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several tests load a build tool by file path. Tools import their siblings
# bare (`import enrich_routes`, `from world_source import load_world`), which
# only resolves when tools/ is importable -- true when a tool runs as a script.
pythonpath = ["tools"]
# Per-test timeout (thread method works on Windows) so a hung build tool fails
# fast with a stack trace instead of stalling the whole run.
#
# What remains here is the Python that still SHIPS: the build, bake, indexing
# and release tooling under tools/, plus the workflow and sound-pack guards.
# The ~220 files that mirrored gameplay in src/freight_fate/ were retired on
# 2026-08-29 -- Career 1.9 is the Rust game, and `cargo test` is what proves
# it. Keeping a second suite green against the reference implementation cost
# more than it caught.
#
# -n auto still spreads the run across cores, capped in tests/conftest.py:
# past about eight the run stops getting faster and, on a 28-core machine,
# started dying with an INTERNALERROR in the reporter.
addopts = "-q -n auto --timeout=120 --timeout-method=thread"
markers = [
    "property: property-based randomized tests",
    "smoke: headless end-to-end smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
