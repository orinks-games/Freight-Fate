[workspace]
resolver = "2"
members = [
    "crates/bass-sys",
    "crates/ff-core",
    "crates/freight-fate",
]

[workspace.package]
version = "1.9.0"
edition = "2021"
rust-version = "1.95"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/orinks-games/Freight-Fate"
authors = ["Joshua Tubbs (Orinks)"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes the parser correctly rounded, which Python's
# `json.loads` (ultimately `float()`) always is. Without it serde_json takes a
# fast path that converts the significand to f64 before scaling by a power of
# ten, so any literal with more than fifteen significant digits can land one
# ulp away from the value Python read out of the same bytes. A save signature
# is an HMAC over those numbers re-rendered as text, so one ulp of drift on a
# single duty-log hour falsely marked a legitimate career as modified.
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tempfile = "3"
libloading = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip", "platform-verifier"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
discord-rich-presence = "0.2"
rustfft = "6"
realfft = "3"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
regex = "1"
sdl2 = "0.38"
raw-window-handle = "0.6"
url = "2"
form_urlencoded = "1"
webbrowser = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
proptest = "1"
memmap2 = "0.9"
# 2.x, not 3: the 3.0.0 release on crates.io ships with no features at all
# (no `serde`, no `derive`), so `features = ["serde"]` fails to resolve.
bincode = { version = "2", features = ["serde"] }
zstd = "0.13"

[workspace.lints.rust]
# `--cfg ci_quick` is what the per-push CI passes so the whole-map sweeps
# (`#[cfg_attr(ci_quick, ignore = "sweep: ...")]`) are left to the nightly
# snapshot build and to full local runs; see .github/workflows/rust.yml.
# Declared here so `unexpected_cfgs` stays quiet under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ci_quick)"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
# opt-level 0 compiles noticeably faster and the game is not CPU-bound in a
# debug run; the one place that wanted optimisation was the world load, and
# the baked container solved that instead.
opt-level = 0

[profile.test]
# Debug info is the bulk of what the linker writes, and ~127 test binaries
# each carry a copy: turning it off was worth minutes per cold build and a
# few gigabytes on disk. A backtrace still names the failing test; only
# line numbers inside dependencies are lost.
debug = 0
# The dev profile reasons that the GAME is not CPU-bound in a debug run,
# which is true and does not carry over here: the suite drives whole
# simulated trips, and at opt-level 0 one playtest binary took 105 seconds
# and ff-core alone took 100. Tests are compiled once and run over and over,
# so the trade runs the other way from the game build. Level 1, not 2: at
# four threads the game crate's suite ran in 60 s at level 1 against 58 s
# at level 2 (2026-09-02), and the hosted Windows runner spends four
# minutes compiling the two big test binaries, which is where the LLVM
# time saved by the lower level goes.
opt-level = 1

[profile.dev.package."*"]
# Dependencies are compiled once and never edited, so optimising them costs
# nothing in iteration time and speeds every test that parses, hashes or
# decompresses.
opt-level = 2
