[package]
name = "freight-fate"
description = "Freight Fate: an accessible, audio-first cross-country trucking simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "freight_fate"
path = "src/lib.rs"

[[bin]]
name = "freightfate"
path = "src/main.rs"

# The agent server is tooling for playtesting agents, not the game, so its
# tests stay out of a plain `cargo test`. Run them with
# `cargo test -p freight-fate --test agent_server`; CI runs that as its own step.
[[test]]
name = "agent_server"
path = "tests/agent_server.rs"
test = false
required-features = ["agent-server"]

# The visual display in a real window, driven by sight in real time. It
# needs a desktop and two minutes, so it is run by name, never by a plain
# `cargo test`: see the file for how.
[[test]]
name = "real_window"
path = "tests/real_window.rs"
harness = false
test = false
required-features = ["visuals"]

[features]
default = ["agent-server", "visuals"]
# `--agent-server`: the MCP server that lets an agent play, including a
# `--staging` mode that backs up to the staging site. Dev builds have it;
# player builds leave it out, because cargo tools build-release builds with
# --no-default-features.
agent-server = []
# The visual display (`src/visuals/`): the road, dashboard, menus and
# captions drawn in the game window, its fonts, and the Visual display row in
# Settings. Player builds name it (`--features visuals` in
# cargo tools build-release and cargo tools build-ios), since they leave the
# default features out. Without it the window stays a plain dark fill.
#
# `sdl2/unsafe_textures`: the display keeps one glyph-atlas texture for the
# life of the renderer, which the borrow-checked `Texture<'creator>` cannot
# live beside in the same struct. The renderer frees it when it goes.
visuals = ["dep:ab_glyph", "dep:memmap2", "dep:objc2-app-kit", "sdl2/unsafe_textures"]

[lints]
workspace = true

[dependencies]
ff-core = { path = "../ff-core" }
hearken.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
flate2.workspace = true
crc32fast.workspace = true
zip.workspace = true
tar.workspace = true
ureq.workspace = true
keyring.workspace = true
discord-rich-presence.workspace = true
once_cell.workspace = true
regex.workspace = true
sdl2 = { workspace = true, features = ["raw-window-handle"] }
ab_glyph = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
url.workspace = true
webbrowser.workspace = true
sys-locale.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
raw-window-handle.workspace = true

# Windows links SDL2 against the prebuilt import library under `vendor/sdl2/`,
# which build.rs puts on the linker's search path. macOS builds SDL2 from
# source and links it statically (`bundled` + `static-link`), so the shipped
# app depends on no SDL dylib at all. It used to come from Homebrew via
# `use-pkgconfig`, until Homebrew retired the real SDL2: `brew install sdl2`
# now installs sdl2-compat, a shim that loads SDL3 at RUNTIME -- invisible to
# any install-name audit -- so the bundled app died on every tester Mac
# without Homebrew's SDL3 ("failed to load sdl3", 2026-08-30).
[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }
# The visual display asks AppKit whether the window is covered.
objc2-app-kit = { workspace = true, optional = true }

# Linux compiles SDL2 in the same way, for a different reason: every distro
# ships a libSDL2-2.0.so.0, but not the same one, and a tarball that has to
# run on Fedora, Arch and Debian alike cannot pick which. The static build
# still opens X11, Wayland, PulseAudio, PipeWire and ALSA through dlopen at
# run time, so what the player's machine lacks is skipped rather than fatal.
# The executable does link libc, D-Bus, and ALSA's libasound.so.2, which
# Hearken's audio engine (cpal) links to reach the sound server: a machine
# without libasound2 cannot start the game.
[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

# iOS compiles SDL2 in for the same reason as macOS, and because an app
# bundle may not load a dylib from anywhere but its own Frameworks folder.
# The UIKit gesture and VoiceOver layer is Objective-C, built by `cc`.
[target.'cfg(target_os = "ios")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }
raw-window-handle.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile.workspace = true
